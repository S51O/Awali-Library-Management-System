
name: Pull Request Checks

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  setup:
    name: Prepare Java Environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java
        run: java -version

      - name: Compile Java Source and Test Files
        run: |
          mkdir -p build/classes
          find src -name '*.java' -print0 | xargs -0 javac -cp "lib/junit-platform-console-standalone-6.1.3.jar" -d build/classes

      - name: Run JUnit Tests
        run: |
          java -jar lib/junit-platform-console-standalone-6.1.3.jar execute --class-path build/classes --scan-class-path


name: Pull Request Checks

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  setup:
    name: Prepare Java Environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java
        run: java -version
      - name: Install Virtual Display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth

      - name: Compile Java Source and Test Files
        run: |
          mkdir -p build/classes
          find src -name '*.java' -print0 | xargs -0 javac -cp "lib/junit-platform-console-standalone-6.1.3.jar" -d build/classes
      - name: Set Up Virtual Display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1024x768x24 > /tmp/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 2
      - name: Run JUnit Tests
        run: |
          java -jar lib/junit-platform-console-standalone-6.1.3.jar execute --class-path build/classes --scan-class-path
